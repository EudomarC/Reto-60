<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Reto 60</title><script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:linear-gradient(160deg,#080b18,#151a38);color:white;display:flex;justify-content:center}.app{width:100%;max-width:500px;padding:22px}.logo{text-align:center;font-size:42px;font-weight:900;margin-top:30px}.logo span{color:#ffb800}.subtitle{text-align:center;color:#aaa;margin-bottom:30px}.stats{display:flex;gap:12px;margin-bottom:25px}.card{flex:1;background:#1d2347;border-radius:18px;padding:16px;text-align:center}.number{font-size:24px;font-weight:bold}.small{font-size:12px;color:#aaa;margin-top:5px}.panel{background:#151a35;border:1px solid #292f5c;border-radius:22px;padding:25px;text-align:center;margin-bottom:16px}.question{font-size:26px;font-weight:bold;margin:25px 0}.timer{font-size:38px;font-weight:bold;color:#ffb800}button{width:100%;border:0;border-radius:16px;padding:17px;margin-top:12px;font-size:17px;font-weight:bold;cursor:pointer}.play{background:#ffb800;color:#111;font-size:20px}.answer,.category{background:#252c58;color:white}.answer:active,.category:active{transform:scale(.98)}.category:disabled{opacity:.4;cursor:not-allowed}.hidden{display:none}.score{font-size:48px;font-weight:bold;color:#ffb800}.share{background:#28a8e9;color:white}.restart{background:#292f5c;color:white}.category-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.category-grid button{margin:0;min-height:72px}.mode{font-size:14px;color:#ffb800;font-weight:bold;margin-top:8px}.count{display:block;font-size:11px;font-weight:normal;color:#aaa;margin-top:5px}</style></head>
<body><div class="app"><div id="home"><div class="logo">RETO <span>60</span></div><div class="subtitle">60 segundos. Un reto. Todos los días.</div><div class="stats"><div class="card"><div class="number">🔥 <span id="streak">0</span></div><div class="small">RACHA</div></div><div class="card"><div class="number">⭐ <span id="total">0</span></div><div class="small">PUNTOS</div></div></div><div class="panel"><div>⚡ RETO 60</div><h2>Todo mezclado</h2><p>Preguntas de todas las categorías. Este sigue siendo el modo principal.</p><button class="play" onclick="startGame('all')">▶ JUGAR RETO 60</button></div><div class="panel"><h2>🎯 Categorías</h2><p>Elige un tema para practicar o competir con amigos.</p><div class="category-grid" id="categoryGrid"></div></div></div>
<div id="game" class="hidden"><div class="panel"><div>TIEMPO</div><div class="timer"><span id="time">60</span>s</div><div class="mode" id="gameMode"></div><div class="small">PUNTOS: <span id="currentScore">0</span></div><div class="question" id="question"></div><div id="answers"></div></div></div><div id="result" class="hidden"><div class="logo">RETO <span>60</span></div><div class="panel"><div>🏆 RESULTADO</div><div class="mode" id="resultMode"></div><div class="score" id="finalScore">0</div><p>puntos</p><h2 id="message">¡Buen intento!</h2><button class="share" onclick="shareGame()">⚔️ DESAFIAR A UN AMIGO</button><button class="restart" onclick="goHome()">VOLVER</button></div></div></div>
<script src="questions.js"></script><script src="categories.js"></script><script>
let score=0,seconds=60,timer,questionDeck=[],gameEnded=false,currentCategory="all";const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand();}
const bankAudit=sanitizeQuestionBank([...questions,...extraCategoryQuestions]);const fullQuestionBank=bankAudit.clean;if(bankAudit.rejected.length)console.warn(`Reto 60: ${bankAudit.rejected.length} preguntas excluidas por control de calidad`,bankAudit.rejected);console.info(`Reto 60: ${fullQuestionBank.length} preguntas válidas listas para jugar`);
function refreshStats(){document.getElementById("total").innerText=localStorage.getItem("reto60points")||0;document.getElementById("streak").innerText=localStorage.getItem("reto60streak")||0;}refreshStats();
function categoryLabel(id){return categoryDefinitions.find(x=>x.id===id)?.label||"⚡ Todo mezclado";}function getQuestionPool(category){if(category==="all")return fullQuestionBank;return fullQuestionBank.filter(item=>inferQuestionCategory(item)===category);}
function renderCategories(){const grid=document.getElementById("categoryGrid");grid.innerHTML="";categoryDefinitions.filter(x=>x.id!=="all").forEach(cat=>{const count=getQuestionPool(cat.id).length,b=document.createElement("button");b.className="category";b.disabled=count===0;b.innerHTML=cat.label+`<span class="count">${count?count+" preguntas":"Próximamente"}</span>`;b.onclick=()=>startGame(cat.id);grid.appendChild(b);});}renderCategories();
function shuffledQuestions(pool){const deck=[...pool];for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];}return deck;}
function startGame(category="all"){currentCategory=category;const pool=getQuestionPool(category);if(!pool.length){alert("Esta categoría está creciendo. Prueba otra por ahora.");return;}score=0;seconds=60;gameEnded=false;questionDeck=shuffledQuestions(pool);clearInterval(timer);document.getElementById("home").classList.add("hidden");document.getElementById("result").classList.add("hidden");document.getElementById("game").classList.remove("hidden");document.getElementById("currentScore").innerText=0;document.getElementById("time").innerText=60;document.getElementById("gameMode").innerText=categoryLabel(category);nextQuestion();timer=setInterval(()=>{seconds--;document.getElementById("time").innerText=seconds;if(seconds<=0)endGame();},1000);}
function nextQuestion(){if(gameEnded)return;if(!questionDeck.length){endGame();return;}const item=questionDeck.pop();document.getElementById("question").innerText=item.q;const box=document.getElementById("answers");box.innerHTML="";item.a.forEach((text,index)=>{const b=document.createElement("button");b.className="answer";b.innerText=text;b.onclick=()=>{if(seconds<=0||gameEnded)return;if(index===item.c){score+=10;tg?.HapticFeedback?.notificationOccurred("success");}else{score=Math.max(0,score-5);tg?.HapticFeedback?.notificationOccurred("error");}document.getElementById("currentScore").innerText=score;nextQuestion();};box.appendChild(b);});}
function endGame(){if(gameEnded)return;gameEnded=true;clearInterval(timer);document.getElementById("game").classList.add("hidden");document.getElementById("result").classList.remove("hidden");document.getElementById("finalScore").innerText=score;document.getElementById("resultMode").innerText=categoryLabel(currentCategory);let total=Number(localStorage.getItem("reto60points")||0);total+=score;localStorage.setItem("reto60points",total);updateStreak();document.getElementById("message").innerText=score>=150?"🔥 ¡Estás imparable!":score>=80?"⚡ ¡Muy buena puntuación!":"💪 ¡Puedes superarlo!";}
function updateStreak(){const today=new Date(),todayKey=today.toISOString().slice(0,10),lastDay=localStorage.getItem("reto60lastday");if(lastDay===todayKey)return;let streak=Number(localStorage.getItem("reto60streak")||0);if(lastDay){const previous=new Date(today);previous.setDate(previous.getDate()-1);streak=lastDay===previous.toISOString().slice(0,10)?streak+1:1;}else streak=1;localStorage.setItem("reto60streak",streak);localStorage.setItem("reto60lastday",todayKey);}
function goHome(){document.getElementById("result").classList.add("hidden");document.getElementById("home").classList.remove("hidden");refreshStats();}function shareGame(){const mode=categoryLabel(currentCategory).replace(/^[^\wÁÉÍÓÚÑ]+/u,"");const text="🔥 Conseguí "+score+" puntos en RETO 60 · "+mode+". ¿Puedes superarme? ⚔️";const gameURL="https://t.me/Reto60GameBot";const url="https://t.me/share/url?url="+encodeURIComponent(gameURL)+"&text="+encodeURIComponent(text);if(tg)tg.openTelegramLink(url);else window.open(url,"_blank");}
</script></body></html>

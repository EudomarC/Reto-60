<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Reto 60</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 min-height:100vh;
 font-family:Arial,sans-serif;
 background:linear-gradient(160deg,#080b18,#151a38);
 color:white;
 display:flex;
 justify-content:center;
}
.app{
 width:100%;
 max-width:500px;
 padding:22px;
}
.logo{
 text-align:center;
 font-size:42px;
 font-weight:900;
 margin-top:30px;
}
.logo span{color:#ffb800}
.subtitle{
 text-align:center;
 color:#aaa;
 margin-bottom:30px;
}
.stats{
 display:flex;
 gap:12px;
 margin-bottom:25px;
}
.card{
 flex:1;
 background:#1d2347;
 border-radius:18px;
 padding:16px;
 text-align:center;
}
.number{
 font-size:24px;
 font-weight:bold;
}
.small{
 font-size:12px;
 color:#aaa;
 margin-top:5px;
}
.panel{
 background:#151a35;
 border:1px solid #292f5c;
 border-radius:22px;
 padding:25px;
 text-align:center;
}
.question{
 font-size:26px;
 font-weight:bold;
 margin:25px 0;
}
.timer{
 font-size:38px;
 font-weight:bold;
 color:#ffb800;
}
button{
 width:100%;
 border:0;
 border-radius:16px;
 padding:17px;
 margin-top:12px;
 font-size:17px;
 font-weight:bold;
 cursor:pointer;
}
.play{
 background:#ffb800;
 color:#111;
 font-size:20px;
}
.answer{
 background:#252c58;
 color:white;
}
.answer:active{
 transform:scale(.98);
}
.hidden{display:none}
.score{
 font-size:48px;
 font-weight:bold;
 color:#ffb800;
}
.share{
 background:#28a8e9;
 color:white;
}
.restart{
 background:#292f5c;
 color:white;
}
</style>
</head>

<body>

<div class="app">

<div id="home">
 <div class="logo">RETO <span>60</span></div>
 <div class="subtitle">60 segundos. Un reto. Todos los días.</div>

 <div class="stats">
   <div class="card">
     <div class="number">🔥 <span id="streak">0</span></div>
     <div class="small">RACHA</div>
   </div>
   <div class="card">
     <div class="number">⭐ <span id="total">0</span></div>
     <div class="small">PUNTOS</div>
   </div>
 </div>

 <div class="panel">
   <div>⚡ RETO DEL DÍA</div>
   <h2>¿Cuántas puedes acertar?</h2>
   <p>Tienes 60 segundos para conseguir la mayor puntuación posible.</p>
   <button class="play" onclick="startGame()">▶ JUGAR</button>
 </div>
</div>

<div id="game" class="hidden">
 <div class="panel">
   <div>TIEMPO</div>
   <div class="timer"><span id="time">60</span>s</div>
   <div class="small">PUNTOS: <span id="currentScore">0</span></div>

   <div class="question" id="question"></div>
   <div id="answers"></div>
 </div>
</div>

<div id="result" class="hidden">
 <div class="logo">RETO <span>60</span></div>

 <div class="panel">
   <div>🏆 RESULTADO</div>
   <div class="score" id="finalScore">0</div>
   <p>puntos</p>

   <h2 id="message">¡Buen intento!</h2>

   <button class="share" onclick="shareGame()">
     ⚔️ DESAFIAR A UN AMIGO
   </button>

   <button class="restart" onclick="goHome()">
     VOLVER
   </button>
 </div>
</div>

</div>

<script>
const questions=[
 {q:"¿Cuánto es 8 × 7?",a:["54","56","64","48"],c:1},
 {q:"¿Cuál es el planeta rojo?",a:["Venus","Marte","Júpiter","Mercurio"],c:1},
 {q:"¿Cuánto es 15 + 27?",a:["40","41","42","43"],c:2},
 {q:"¿Qué animal es el más grande?",a:["Elefante","Ballena azul","Jirafa","Tiburón"],c:1},
 {q:"¿Cuántos lados tiene un hexágono?",a:["5","6","7","8"],c:1},
 {q:"¿Cuánto es 100 ÷ 4?",a:["20","25","30","40"],c:1},
 {q:"¿Cuál es la capital de Chile?",a:["Lima","Santiago","Bogotá","Caracas"],c:1},
 {q:"¿Cuánto es 9 × 9?",a:["72","79","81","89"],c:2},
 {q:"¿Qué océano es el más grande?",a:["Atlántico","Índico","Pacífico","Ártico"],c:2},
 {q:"¿Cuántos minutos tiene una hora?",a:["30","50","60","100"],c:2}
];

let score=0;
let seconds=60;
let timer;
let last=-1;

const tg=window.Telegram?.WebApp;

if(tg){
 tg.ready();
 tg.expand();
}

document.getElementById("total").innerText=
 localStorage.getItem("reto60points")||0;

document.getElementById("streak").innerText=
 localStorage.getItem("reto60streak")||0;

function startGame(){
 score=0;
 seconds=60;

 document.getElementById("home").classList.add("hidden");
 document.getElementById("result").classList.add("hidden");
 document.getElementById("game").classList.remove("hidden");

 document.getElementById("currentScore").innerText=0;
 document.getElementById("time").innerText=60;

 nextQuestion();

 timer=setInterval(()=>{
   seconds--;
   document.getElementById("time").innerText=seconds;

   if(seconds<=0){
     clearInterval(timer);
     endGame();
   }
 },1000);
}

function nextQuestion(){
 let n;
 do{
   n=Math.floor(Math.random()*questions.length);
 }while(n===last);

 last=n;
 const item=questions[n];

 document.getElementById("question").innerText=item.q;

 const box=document.getElementById("answers");
 box.innerHTML="";

 item.a.forEach((text,index)=>{
   const b=document.createElement("button");
   b.className="answer";
   b.innerText=text;

   b.onclick=()=>{
     if(index===item.c){
       score+=10;
       if(tg?.HapticFeedback)
         tg.HapticFeedback.notificationOccurred("success");
     }else{
       score=Math.max(0,score-5);
       if(tg?.HapticFeedback)
         tg.HapticFeedback.notificationOccurred("error");
     }

     document.getElementById("currentScore").innerText=score;
     nextQuestion();
   };

   box.appendChild(b);
 });
}

function endGame(){
 document.getElementById("game").classList.add("hidden");
 document.getElementById("result").classList.remove("hidden");

 document.getElementById("finalScore").innerText=score;

 let total=Number(localStorage.getItem("reto60points")||0);
 total+=score;
 localStorage.setItem("reto60points",total);

 updateStreak();

 if(score>=150)
   document.getElementById("message").innerText="🔥 ¡Estás imparable!";
 else if(score>=80)
   document.getElementById("message").innerText="⚡ ¡Muy buena puntuación!";
 else
   document.getElementById("message").innerText="💪 ¡Puedes superarlo!";
}

function updateStreak(){
 const today=new Date().toDateString();
 const lastDay=localStorage.getItem("reto60lastday");

 if(lastDay===today)return;

 let streak=Number(localStorage.getItem("reto60streak")||0);
 streak++;

 localStorage.setItem("reto60streak",streak);
 localStorage.setItem("reto60lastday",today);
}

function goHome(){
 document.getElementById("result").classList.add("hidden");
 document.getElementById("home").classList.remove("hidden");

 document.getElementById("total").innerText=
   localStorage.getItem("reto60points")||0;

 document.getElementById("streak").innerText=
   localStorage.getItem("reto60streak")||0;
}

function shareGame(){
 const text=
   "🔥 Conseguí "+score+
   " puntos en RETO 60. ¿Puedes superarme? ⚔️";

 const gameURL="https://t.me/Reto60GameBot";

 const url=
   "https://t.me/share/url?url="+
   encodeURIComponent(gameURL)+
   "&text="+encodeURIComponent(text);

 if(tg)
   tg.openTelegramLink(url);
 else
   window.open(url,"_blank");
}
</script>

</body>
</html>

<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reto 60 · Prueba 70s</title><style>html,body{margin:0;background:#080b18}iframe{border:0;width:100%;height:100vh}.bar{position:fixed;z-index:999999;left:10px;right:10px;bottom:10px;background:#151a35;border:2px solid #b597ff;border-radius:18px;padding:10px;font-family:Arial}.bar div{text-align:center;color:#c7b7ff;font-size:11px;margin-bottom:7px}.bar button{width:100%;border:0;border-radius:13px;padding:14px;background:#ffb800;color:#111;font-weight:900;font-size:15px}</style></head><body><iframe id="game" src="./?preview70=1"></iframe><div class="bar"><div>🧪 PRUEBA AISLADA · SIN COBROS</div><button id="arm">⏳ ACTIVAR +10 s</button></div><script>const frame=document.getElementById('game'),btn=document.getElementById('arm');let armed=false,installed=false;function install(){try{const w=frame.contentWindow;if(installed||typeof w.startGame!=='function')return false;const original=w.startGame;w.startGame=function(category='all',challenge=null){const use=armed;let nativeSI=w.setInterval;if(use){w.setInterval=function(cb,delay,...args){let bonus=10;return nativeSI(function(){if(bonus>0){bonus--;const el=w.document.getElementById('time');if(el)el.innerText=String(60+bonus);return}cb(...args)},delay)}}try{original(category,challenge)}finally{w.setInterval=nativeSI}if(use){const el=w.document.getElementById('time');if(el)el.innerText='70';const mode=w.document.getElementById('gameMode');if(mode)mode.innerText+=(mode.innerText?' · ':'')+'⏳ +10 s ACTIVADO';armed=false;btn.textContent='⏳ ACTIVAR +10 s'}};installed=true;return true}catch(e){return false}}frame.onload=()=>{let n=0;const t=setInterval(()=>{if(install()||++n>100)clearInterval(t)},100)};btn.onclick=()=>{armed=true;btn.textContent='✅ ACTIVADO · INICIA UNA PARTIDA';install()};</script></body></html>
